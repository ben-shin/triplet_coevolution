name: Test and verify distributions
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BLAST_USAGE_REPORT: 'false'
  MPLBACKEND: Agg

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.bounds }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ['3.11', '3.15']
        bounds: [latest-compatible]
        include:
          - {os: ubuntu-24.04, python: '3.11', bounds: minimum}
          - {os: ubuntu-24.04, python: '3.12', bounds: latest-compatible}
          - {os: ubuntu-24.04, python: '3.13', bounds: latest-compatible}
          - {os: ubuntu-24.04, python: '3.14', bounds: latest-compatible}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '${{ matrix.python }}'}
      - if: matrix.bounds == 'minimum'
        run: python -m pip install -c requirements/minimum-py311.txt -e ".[dev,plots,optimize]"
      - if: matrix.bounds != 'minimum'
        run: python -m pip install -e ".[dev,plots,optimize]"
      - run: python -m pip check
      - run: python -m pytest -q -rs
      - if: matrix.bounds == 'minimum'
        run: |
          python -m pip install -c requirements/minimum-py311.txt "pip-audit==2.10.1"
          python tools/release/audit_dependencies.py --runtime-only

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.13'}
      - run: python -m pip install -r requirements/release.txt -e ".[dev,plots,optimize]"
      - run: python -m ruff check src tests tools/release
      - run: python -m ruff format --check src/triplet_coevolution/validation src/triplet_coevolution/structure tools/release tests/test_release_validation.py
      - run: python -m mypy
      - run: python -m coverage run -m pytest -q -rs
      - run: python -m coverage combine
      - run: python -m coverage report
      - run: python -m coverage json -o runner-coverage.json
      - run: python tools/release/coverage_summary.py runner-coverage.json
      - run: python tools/release/audit_dependencies.py

  artifacts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.13'}
      - run: python -m pip install -r requirements/release.txt
      - run: python -m build --no-isolation
      - run: python tools/release/check_distributions.py --dist dist --wheelhouse wheelhouse

  optional-scientific:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.13'}
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends hmmer infernal ncbi-blast+
          echo "/usr/lib/infernal" >> "$GITHUB_PATH"
      - run: python -m pip install -e ".[dev,plots,optimize]"
      - run: |
          for tool in hmmsearch hmmbuild jackhmmer hmmalign nhmmer cmsearch cmbuild cmcalibrate cmalign makeblastdb psiblast; do
            command -v "$tool"
          done
          dpkg-query --show hmmer infernal ncbi-blast+
      - run: python -m pytest -q -rs tests/test_profile_search.py tests/test_search_discovery.py tests/test_indexed_workflows.py
      - run: python benchmarks/tree_calibration.py --repetitions 320 --draws 99
      - run: python benchmarks/distributed_nulls.py --draws 4099

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triplet-coevolution"
dynamic = ["version"]
description = "Pairwise mutual information across three matched protein or nucleotide alignments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "biopython>=1.86,<2",
  "typer>=0.26,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
triplet = "triplet_coevolution.cli:app"

[tool.setuptools.dynamic]
version = {attr = "triplet_coevolution.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["triplet_coevolution*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

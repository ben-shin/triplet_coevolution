[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triplet-coevolution"
dynamic = ["version"]
description = "Search, pair and model coevolution across three protein or nucleotide components"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "biopython>=1.87,<2",
  "typer>=0.26,<1",
]

[project.optional-dependencies]
optimize = ["scipy>=1.11,<2"]
dev = ["pytest>=8", "ruff>=0.8"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
triplet = "triplet_coevolution.cli:app"

[project.urls]
Repository = "https://github.com/ben-shin/triplet_coevolution"

[tool.setuptools.dynamic]
version = {attr = "triplet_coevolution.__version__"}

[tool.setuptools.cmdclass]
build_py = "_triplet_build.BuildPy"
sdist = "_triplet_build.SourceDist"

[tool.setuptools.packages.find]
where = ["src"]
include = ["triplet_coevolution*"]

[tool.setuptools.package-data]
"triplet_coevolution.reporting" = ["explorer.js", "explorer.css"]

[tool.setuptools.data-files]
"share/triplet-coevolution" = ["README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md"]
"share/triplet-coevolution/input" = ["input/README.md"]
"share/triplet-coevolution/docs" = ["docs/*.md"]
"share/triplet-coevolution/benchmarks" = [
  "benchmarks/*.py", "benchmarks/gatabc_manifest.json", "benchmarks/experimental_*.json",
  "benchmarks/experimental_structure_metrics.tsv", "benchmarks/independent_cohort_*.json",
  "benchmarks/independent_cohort_*.gz", "benchmarks/independent_evaluation_policy.json",
  "benchmarks/independent_*_metrics.json", "benchmarks/independent_*_metrics.tsv", "benchmarks/independent_*_metrics.json.gz",
  "benchmarks/*.md",
]
"share/triplet-coevolution/examples/structure" = [
  "examples/structure/config.json", "examples/structure/references.fasta",
  "examples/structure/candidates.tsv", "examples/structure/mixed.cif",
]
"share/triplet-coevolution/examples/hpc" = ["examples/hpc/null-array.sh"]
"share/triplet-coevolution/examples/mixed" = [
  "examples/mixed/protein.fasta", "examples/mixed/dna.fasta", "examples/mixed/rna.fasta",
  "examples/mixed/matches.tsv", "examples/mixed/clade-study.json", "examples/mixed/conditional.json",
  "examples/mixed/dca-grid.json", "examples/mixed/local-model.json", "examples/mixed/null-policy.json",
  "examples/mixed/observations.nwk", "examples/mixed/tree-null.json",
]
"share/triplet-coevolution/examples/workflow" = [
  "examples/workflow/A_database.fasta", "examples/workflow/B_database.fasta", "examples/workflow/C_database.fasta",
  "examples/workflow/A_ref.fasta", "examples/workflow/B_ref.fasta", "examples/workflow/C_ref.fasta",
  "examples/workflow/evidence.tsv", "examples/workflow/prepare.json", "examples/workflow/run.json",
  "examples/workflow/synthetic_labels.tsv",
]
"share/triplet-coevolution/examples/families" = ["examples/families/project.json", "examples/families/mappings.tsv"]
"share/triplet-coevolution/examples/families/ATPase" = ["examples/families/ATPase/component.json", "examples/families/ATPase/family.sto", "examples/families/ATPase/targets.txt"]
"share/triplet-coevolution/examples/families/Partner" = ["examples/families/Partner/component.json", "examples/families/Partner/family.sto"]
"share/triplet-coevolution/examples/families/guide_RNA" = ["examples/families/guide_RNA/component.json", "examples/families/guide_RNA/family.sto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
files = [
  "src/triplet_coevolution/core/alignment.py", "src/triplet_coevolution/core/coordinates.py",
  "src/triplet_coevolution/structure/types.py", "src/triplet_coevolution/validation/fdr.py",
  "src/triplet_coevolution/validation/tree_topology.py",
]
check_untyped_defs = true
follow_imports = "silent"
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source_pkgs = ["triplet_coevolution.core", "triplet_coevolution.validation"]
patch = ["subprocess"]
concurrency = ["thread", "multiprocessing"]
parallel = true

[tool.coverage.report]
precision = 2

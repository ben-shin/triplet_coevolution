[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triplet-coevolution"
version = "0.1.0"
description = "three component mixed alphabet evolutionary coupling analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "biopython>=1.86,<2",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
triplet = "triplet_coevolution.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["triplet_coevolution*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
  

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triplet-coevolution"
dynamic = ["version"]
description = "Search, pair and model coevolution across three protein or nucleotide components"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "biopython>=1.86,<2",
  "typer>=0.26,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
triplet = "triplet_coevolution.cli:app"

[project.urls]
Repository = "https://github.com/ben-shin/triplet_coevolution"

[tool.setuptools.dynamic]
version = {attr = "triplet_coevolution.__version__"}

[tool.setuptools.cmdclass]
build_py = "_triplet_build.BuildPy"
sdist = "_triplet_build.SourceDist"

[tool.setuptools.packages.find]
where = ["src"]
include = ["triplet_coevolution*"]

[tool.setuptools.data-files]
"share/triplet-coevolution" = ["README.md"]
"share/triplet-coevolution/input" = ["input/README.md"]
"share/triplet-coevolution/docs" = ["docs/*.md"]
"share/triplet-coevolution/benchmarks" = [
  "benchmarks/*.py", "benchmarks/gatabc_manifest.json", "benchmarks/*.md",
]
"share/triplet-coevolution/examples/structure" = ["examples/structure/*"]
"share/triplet-coevolution/examples/mixed" = ["examples/mixed/*"]
"share/triplet-coevolution/examples/workflow" = ["examples/workflow/*"]
"share/triplet-coevolution/examples/families" = ["examples/families/*.tsv", "examples/families/*.json"]
"share/triplet-coevolution/examples/families/ATPase" = ["examples/families/ATPase/*"]
"share/triplet-coevolution/examples/families/Partner" = ["examples/families/Partner/*"]
"share/triplet-coevolution/examples/families/guide_RNA" = ["examples/families/guide_RNA/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
